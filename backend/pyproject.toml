[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.149.0",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pandas-stubs~=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "seaborn>=0.13.2",
]

[tool.fastapi]
entrypoint="app.main:app"
